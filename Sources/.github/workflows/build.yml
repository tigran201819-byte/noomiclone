name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild archive \
            -project NoomiOffline.xcodeproj \
            -scheme NoomiOffline \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/NoomiOffline.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/NoomiOffline.xcarchive/Products/Applications/NoomiOffline.app Payload/
          zip -r NoomiOffline-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NoomiOffline-unsigned
          path: NoomiOffline-unsigned.ipa
